<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://i.pinimg.com/1200x/98/5d/64/985d643c175ad9f6ec1d4dd7df8f9496.jpg">
    <title>Slot machine</title>

    <style>
        :root {
            --bg: #17112b;
            --panel: #261b3e;
            --text: #fff8ff;
            --muted: #d1bfdc;
            --accent: #ff9acb;
            --gold: #b9a1ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 28px 16px;
            display: grid;
            place-items: center;
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            background:
                linear-gradient(135deg, #180d2bf0, #491c5be0),
                url('https://oss.aiyuzhou8.com/2024/07/20240722015556805.webp')
                center / cover fixed;
        }

        .game {
            width: min(100%, 760px);
            padding: clamp(20px, 5vw, 42px);
            text-align: center;
            background: linear-gradient(145deg, #2d2049ed, #1c142ff0);
            border: 1px solid #e6c8ff40;
            border-radius: 26px;
            box-shadow: 0 18px 45px #08031155;
            backdrop-filter: blur(8px);
        }

        .eyebrow {
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: bold;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        h1 {
            color: var(--text);
            font-family: Georgia, serif;
            font-size: clamp(2rem, 5vw, 3.4rem);
            margin: 9px 0;
        }

        h1 span {
            color: var(--accent);
        }

        .subtitle,
        .rules {
            color: var(--muted);
            line-height: 1.5;
        }

        #playerLabel {
            color: var(--muted);
            margin: 15px 0;
            font-size: 0.95rem;
        }

        #playerLabel strong {
            color: var(--text);
        }

        .machine {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            padding: 14px;
            margin: 22px auto;
            max-width: 520px;
            background: #17112b;
            border: 2px solid #e6c8ff40;
            border-radius: 20px;
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.4);
        }

        .reel {
            display: grid;
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
        }

        .symbol {
            display: grid;
            place-items: center;
            aspect-ratio: 1;
            min-height: 60px;
            font-size: clamp(2rem, 7vw, 3.8rem);
            background: #261b3e;
            border: 1px solid #e6c8ff3d;
            border-radius: 14px;
            box-shadow: 0 4px 12px #08031133;
        }

        .symbol.spinning {
            animation: wobble 0.16s infinite alternate;
        }

        @keyframes wobble {
            from {
                transform: translateY(-2px);
            }
            to {
                transform: translateY(2px);
            }
        }

        .status {
            min-height: 54px;
            color: var(--accent);
            font-weight: bold;
            line-height: 1.5;
            margin: 15px 0;
        }

        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        button {
            padding: 13px 24px;
            border: 0;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform .15s, filter .15s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        #spinButton {
            color: #281333;
            background: linear-gradient(135deg, #ffacd4, #c5aaff);
            box-shadow: 0 8px 20px rgba(255, 154, 203, 0.3);
        }

        #resetButton {
            color: var(--text);
            background: #3a2a51;
            border: 1px solid #9c79bb70;
        }

        .rules {
            margin-top: 24px;
            font-size: 0.85rem;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .game {
                padding: 20px 14px;
            }

            .machine {
                gap: 7px;
                padding: 8px;
            }

            .reel {
                gap: 6px;
            }

            .symbol {
                min-height: 0;
                border-radius: 8px;
            }

            button {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <main class="game">
        <p class="eyebrow">✦ Slot machine · Лабораторна робота ✦</p>
        <h1>Однорукий <span>бандит</span></h1>

        <p class="subtitle">
            Три барабани, трохи удачі та три спроби.
            Чи вдасться зібрати однакові символи?
        </p>

        <p id="playerLabel">Гравець: <strong>—</strong></p>

        <section class="machine" aria-label="Ігрові барабани">
            <div class="reel" id="reel0"></div>
            <div class="reel" id="reel1"></div>
            <div class="reel" id="reel2"></div>
        </section>

        <p class="status" id="status" role="status" aria-live="polite">
            Натисни «Крутити», щоб почати!
        </p>

        <div class="controls">
            <button id="spinButton" type="button">
                🎲 Крутити
            </button>

            <button id="resetButton" type="button">
                ↻ Нова гра
            </button>
        </div>

        <p class="rules">
            Правила: потрібно отримати три однакові символи
            в одному горизонтальному рядку.
            Усього є 3 спроби.
        </p>
    </main>

    <script>
        "use strict";

        const symbols = [
            "🍒", "🍋", "🍇", "🍉", "⭐",
            "💎", "🔔", "🍀", "7️⃣"
        ];

        const reels = [
            document.getElementById("reel0"),
            document.getElementById("reel1"),
            document.getElementById("reel2")
        ];

        const playerLabel = document.getElementById("playerLabel");
        const status = document.getElementById("status");
        const spinButton = document.getElementById("spinButton");
        const resetButton = document.getElementById("resetButton");

        let playerName = "";
        let attempts = 0;
        let gameOver = false;
        let spinning = false;

        function getPlayerName() {
            let name = "";

            while (!name) {
                const answer = prompt(
                    "Введіть ваше ім’я (від 1 до 20 символів):"
                );

                if (answer === null) {
                    name = "Гравець";
                    break;
                }

                const trimmed = answer.trim();

                if (trimmed.length === 0) {
                    alert("Ім’я не може бути порожнім.");
                } else if (trimmed.length > 20) {
                    alert("Ім’я має містити не більше 20 символів.");
                } else {
                    name = trimmed;
                }
            }

            return name;
        }

        function getUniqueSymbols() {
            const shuffled = [...symbols];

            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));

                [shuffled[i], shuffled[j]] =
                    [shuffled[j], shuffled[i]];
            }

            return shuffled.slice(0, 3);
        }

        function renderInitialReels() {
            reels.forEach((reel) => {
                reel.replaceChildren();

                getUniqueSymbols().forEach((symbol) => {
                    const cell = document.createElement("div");

                    cell.className = "symbol";
                    cell.textContent = symbol;

                    reel.appendChild(cell);
                });
            });
        }

        function getReelValues() {
            return reels.map((reel) =>
                [...reel.querySelectorAll(".symbol")]
                    .map((cell) => cell.textContent)
            );
        }

        function hasWinningRow(values) {
            for (let row = 0; row < 3; row++) {
                if (
                    values[0][row] === values[1][row] &&
                    values[1][row] === values[2][row]
                ) {
                    return true;
                }
            }

            return false;
        }

        function setSpinning(isSpinning) {
            spinning = isSpinning;
            spinButton.disabled = isSpinning || gameOver;
            resetButton.disabled = isSpinning;

            document.querySelectorAll(".symbol").forEach((cell) => {
                cell.classList.toggle("spinning", isSpinning);
            });
        }

        function spin() {
            if (spinning || gameOver) {
                return;
            }

            attempts++;
            setSpinning(true);

            status.textContent =
                `Спроба ${attempts} із 3… Барабани обертаються!`;

            window.setTimeout(() => {
                renderInitialReels();

                const values = getReelValues();

                setSpinning(false);

                if (hasWinningRow(values)) {
                    gameOver = true;

                    status.textContent =
                        `🎉 Вітаємо, ${playerName}! ` +
                        `Ти переміг/перемогла за ${attempts} спроб(и)!`;

                    spinButton.disabled = true;
                } else if (attempts >= 3) {
                    gameOver = true;

                    status.textContent =
                        `🙂 Спроби закінчилися, ${playerName}. ` +
                        "Спробуй ще раз у новій грі!";

                    spinButton.disabled = true;
                } else {
                    status.textContent =
                        `Цього разу без виграшу. ` +
                        `Залишилося спроб: ${3 - attempts}.`;
                }
            }, 650);
        }

        function newGame(askName = false) {
            if (spinning) {
                return;
            }

            if (askName || !playerName) {
                playerName = getPlayerName();
            }

            attempts = 0;
            gameOver = false;

            playerLabel.innerHTML = `Гравець: <strong>${playerName}</strong>`;
            status.textContent = "Натисніть «Крутити», щоб почати!";
            spinButton.disabled = false;

            renderInitialReels();
        }

        spinButton.addEventListener("click", spin);

        resetButton.addEventListener("click", () => {
            newGame(true);
        });

        newGame();
    </script>
</body>
</html>
