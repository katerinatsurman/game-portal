<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="https://i.pinimg.com/1200x/98/5d/64/985d643c175ad9f6ec1d4dd7df8f9496.jpg">
  <title>Star games</title>
  <style>
    :root {
      --bg: #17112b;
      --panel: #261b3e;
      --text: #fff8ff;
      --muted: #d1bfdc;
      --accent: #ff9acb;
      --gold: #b9a1ff;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        linear-gradient(135deg, #180d2bf0, #491c5be0),
        url('https://oss.aiyuzhou8.com/2024/07/20240722015556805.webp')
        center / cover fixed;
    }
    .app {
      width: min(980px, 100%);
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
      padding: 24px 18px;
      border: 1px solid #ffffff26;
      border-radius: 26px;
      background: linear-gradient(135deg, #2a1a48dd, #5b2e70b8);
      box-shadow: 0 18px 45px #08031155;
      backdrop-filter: blur(10px);
    }
    h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: clamp(2rem, 5vw, 3.4rem);
    }
    h1 span {
      color: var(--accent);
    }
    .labs-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .lab-card {
      text-decoration: none;
      color: inherit;
      padding: 24px;
      border: 1px solid #e6c8ff40;
      border-radius: 24px;
      background: linear-gradient(145deg, #2d2049ed, #1c142ff0);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform .2s, border-color .2s, box-shadow .2s;
      box-shadow: 0 14px 36px #08031155;
      backdrop-filter: blur(8px);
      cursor: pointer;
    }
    .lab-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 18px 40px #08031188;
    }
    .lab-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    h2 {
      font-size: 1.25rem;
      margin: 0;
      font-family: Georgia, serif;
    }
    .icon-btn {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 16px;
      background: linear-gradient(135deg, #ffacd4, #c5aaff);
      color: #281333;
      font-size: 1.2rem;
      font-weight: 800;
      transition: transform .2s, filter .2s;
    }
    .lab-card:hover .icon-btn {
      transform: scale(1.08);
      filter: brightness(1.08);
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #e6c8ff30;
      padding-top: 14px;
      margin-top: 16px;
    }
    .badge {
      font-size: .8rem;
      color: var(--gold);
      background: #3a2a51;
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid #9c79bb50;
    }
    @media (max-width: 620px) {
      body {
        padding: 20px 12px;
      }
      .labs-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>Star <span>games</span></h1>
    </header>

    <section class="labs-grid">
      
      <a href="lab7.html" class="lab-card">
        <div class="lab-head">
          <h2>Лабораторна №7</h2>
          <div class="icon-btn">➔</div>
        </div>
        <div class="card-footer">
          <span class="badge">Готово</span>
          <span style="color: var(--muted); font-size: 0.85rem;">Magic Ball</span>
        </div>
      </a>

     
      <a href="lab8.html" class="lab-card">
        <div class="lab-head">
          <h2>Лабораторна №8</h2>
          <div class="icon-btn">➔</div>
        </div>
        <div class="card-footer">
          <span class="badge">Готово</span>
          <span style="color: var(--muted); font-size: 0.85rem;">Higher Number</span>
        </div>
      </a>

      
      <a href="lab9.html" class="lab-card">
        <div class="lab-head">
          <h2>Лабораторна №9</h2>
          <div class="icon-btn">➔</div>
        </div>
        <div class="card-footer">
          <span class="badge">Готово</span>
          <span style="color: var(--muted); font-size: 0.85rem;">Game «21»</span>
        </div>
      </a>

      
      <a href="lab10.html" class="lab-card">
        <div class="lab-head">
          <h2>Лабораторна №10</h2>
          <div class="icon-btn">➔</div>
        </div>
        <div class="card-footer">
          <span class="badge">Готово</span>
          <span style="color: var(--muted); font-size: 0.85rem;">Slot machine</span>
        </div>
      </a>
    </section>
  </main>
</body>
</html>
