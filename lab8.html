<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №8 — Гра "Більше число"</title>
    
    <link rel="icon" type="image/png" href="https://i.pinimg.com/1200x/98/5d/64/985d643c175ad9f6ec1d4dd7df8f9496.jpg">

    <style>
        :root {
            --bg: #17112b;
            --panel: #261b3e;
            --text: #fff8ff;
            --muted: #d1bfdc;
            --accent: #ff9acb;
            --gold: #b9a1ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 28px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
            background:
                linear-gradient(135deg, #180d2bf0, #491c5be0),
                url('https://oss.aiyuzhou8.com/2024/07/20240722015556805.webp')
                center / cover fixed;
        }

        .app {
            width: min(980px, 100%);
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            padding: 24px 18px;
            border: 1px solid #ffffff26;
            border-radius: 26px;
            background: linear-gradient(135deg, #2a1a48dd, #5b2e70b8);
            box-shadow: 0 18px 45px #08031155;
            backdrop-filter: blur(10px);
        }

        .eyebrow {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: .16em;
            font-size: .78rem;
            font-weight: 700;
        }

        h1 {
            margin: 9px 0;
            font-family: Georgia, serif;
            font-size: clamp(2rem, 5vw, 3.4rem);
        }

        h1 span {
            color: var(--accent);
        }

        .subtitle {
            color: var(--muted);
            line-height: 1.5;
        }

        
        .game-container {
            padding: 30px;
            border: 1px solid #e6c8ff40;
            border-radius: 26px;
            background: linear-gradient(145deg, #2d2049ed, #1c142ff0);
            box-shadow: 0 18px 45px #08031155;
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            width: 100%;
        }

        
        .board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 20px;
        }

        .player-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            background: #211533d9;
            border: 1px solid #e6c8ff3d;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 24px #08031133;
        }

        .player-name {
            font-size: 1.15rem;
            font-weight: bold;
            margin-bottom: 12px;
            text-align: center;
            word-break: break-word;
            font-family: Georgia, serif;
        }

      
        .score-box {
            background: #3a2a51;
            border: 1px solid #9c79bb70;
            color: var(--accent);
            font-size: 1.8rem;
            font-weight: 800;
            width: 100%;
            max-width: 120px;
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 14px;
            margin-bottom: 20px;
        }

        
        .number-circle {
            background: #17112b;
            border: 2px solid #e6c8ff40;
            color: var(--text);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            font-weight: 800;
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.4);
        }

       
        .btn-generate {
            border: 0;
            border-radius: 14px;
            padding: 14px 24px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            color: #281333;
            background: linear-gradient(135deg, #ffacd4, #c5aaff);
            box-shadow: 0 8px 20px rgba(255, 154, 203, 0.3);
            transition: transform .15s, filter .15s;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .btn-generate:active {
            transform: scale(0.96);
        }

        
        .status-message {
            font-size: 1rem;
            font-weight: 600;
            min-height: 30px;
            text-align: center;
            color: var(--muted);
            padding: 12px 20px;
            background: #211533e8;
            border: 1px solid #e6c8ff3d;
            border-radius: 14px;
            width: 100%;
        }

        
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--muted);
            text-decoration: none;
            font-size: .9rem;
            transition: color .2s;
        }

        .back-link:hover {
            color: var(--accent);
        }

       
        @media (max-width: 620px) {
            body {
                padding: 20px 12px;
            }

            .board {
                flex-direction: column;
                gap: 16px;
            }

            .number-circle {
                width: 80px;
                height: 80px;
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <main class="app">
        <header>
            <div class="eyebrow">
                ✦ Лабораторна робота № 8 ✦
            </div>
            <h1>Гра <span>«Більше число»</span></h1>
            <p class="subtitle">
                Порівнюйте випадкові числа й здобудьте перемогу в серії раундів.
            </p>
        </header>

        <div class="game-container">
            <div class="board">
               
                <div class="player-column">
                    <div class="player-name" id="userName">User</div>
                    <div class="score-box" id="userScore">0</div>
                    <div class="number-circle" id="userNumber">?</div>
                </div>

               
                <button class="btn-generate" id="generateBtn">Generate</button>

               
                <div class="player-column">
                    <div class="player-name">Computer</div>
                    <div class="score-box" id="compScore">0</div>
                    <div class="number-circle" id="compNumber">?</div>
                </div>
            </div>

            <div class="status-message" id="statusMessage">Натисніть "Generate", щоб почати!</div>
        </div>

        <a href="index.html" class="back-link">← Повернутися на головний портал</a>
    </main>

    <script>
        let userName = 'User';
        let userScore = 0;
        let compScore = 0;
        const maxWins = 3;

        const userNameElem = document.getElementById('userName');
        const userScoreElem = document.getElementById('userScore');
        const compScoreElem = document.getElementById('compScore');
        const userNumberElem = document.getElementById('userNumber');
        const compNumberElem = document.getElementById('compNumber');
        const generateBtn = document.getElementById('generateBtn');
        const statusMessageElem = document.getElementById('statusMessage');

        function initGame() {
            let inputName = prompt("Введіть ваше ім’я:", "User");
            
            if (inputName !== null && inputName.trim() !== "") {
                userName = inputName.trim();
            } else {
                alert("Ім’я не введено! Буде використано ім’я за замовчуванням 'User'.");
                userName = "User";
            }
            
            userNameElem.textContent = userName;
            resetGame();
        }

        function getRandomNumber() {
            return Math.floor(Math.random() * 10) + 1;
        }

        function playRound() {
            if (userScore >= maxWins || compScore >= maxWins) {
                resetGame();
                return;
            }

            const userNum = getRandomNumber();
            const compNum = getRandomNumber();

            userNumberElem.textContent = userNum;
            compNumberElem.textContent = compNum;

            if (userNum > compNum) {
                userScore++;
                userScoreElem.textContent = userScore;
                statusMessageElem.textContent = `Раунд за ${userName}! (${userNum} > ${compNum})`;
                statusMessageElem.style.color = "#ffacd4";
            } else if (compNum > userNum) {
                compScore++;
                compScoreElem.textContent = compScore;
                statusMessageElem.textContent = `Раунд за Computer! (${compNum} > ${userNum})`;
                statusMessageElem.style.color = "#ff9acb";
            } else {
                statusMessageElem.textContent = `Нічия! (${userNum} = ${compNum})`;
                statusMessageElem.style.color = "#b9a1ff";
            }

            checkWinner();
        }

        function checkWinner() {
            if (userScore === maxWins) {
                statusMessageElem.textContent = `🎉 Вітаємо, ${userName}! Ви виграли серію з рахунком ${userScore}:${compScore}!`;
                statusMessageElem.style.color = "#ffacd4";
                generateBtn.textContent = "Знову";
            } else if (compScore === maxWins) {
                statusMessageElem.textContent = `💻 Переміг Computer з рахунком ${compScore}:${userScore}. Спробуйте ще раз!`;
                statusMessageElem.style.color = "#ff9acb";
                generateBtn.textContent = "Знову";
            }
        }

        function resetGame() {
            userScore = 0;
            compScore = 0;
            userScoreElem.textContent = "0";
            compScoreElem.textContent = "0";
            userNumberElem.textContent = "?";
            compNumberElem.textContent = "?";
            generateBtn.textContent = "Generate";
            statusMessageElem.textContent = "Натисніть \"Generate\", щоб зробити хід!";
            statusMessageElem.style.color = "var(--muted)";
        }

        generateBtn.addEventListener('click', playRound);
        window.addEventListener('load', initGame);
    </script>
</body>
</html>
